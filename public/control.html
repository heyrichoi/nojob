<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>노잡 무공 벌금 · 컨트롤</title>
  <style>
    :root{--bg:#0b0d10;--panel:#16191e;--line:#2a3038;--text:#f5f7fa;--muted:#929aa5;--accent:#00ffa3;--danger:#ff6176;--yellow:#ffd84a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#14221d 0,#0b0d10 38%);color:var(--text);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;min-height:100vh}button,input{font:inherit}.wrap{max-width:1100px;margin:0 auto;padding:24px 18px 60px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:16px}.top h1{font-size:28px;margin:0;letter-spacing:-1px}.sub{font-size:12px;color:var(--muted);margin-top:6px}.status{font-size:12px;color:var(--muted);padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:#14171b}.card{background:linear-gradient(180deg,#191d22,#121519);border:1px solid var(--line);border-radius:16px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.total{padding:20px}.eyebrow{font-size:12px;color:var(--accent);font-weight:900}.big{font-size:44px;font-weight:950;letter-spacing:-2px;margin:5px 0}.meta{display:flex;gap:15px;color:var(--muted);font-size:12px;flex-wrap:wrap}.config{padding:17px}.config h3{font-size:14px;margin:0 0 10px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:block;font-size:10px;color:var(--muted);margin:0 0 5px}.field input{width:100%;background:#0e1115;border:1px solid var(--line);border-radius:9px;color:#fff;padding:9px 10px;outline:none}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer;background:#242a31;color:#e7ebef}.primary{background:var(--accent);color:#001b11}.danger{background:#34171d;color:#ff9cab}.yellow{background:#3b3213;color:#ffe676}.save{margin-top:9px;width:100%}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:17px 0 9px}.toolbar h2{font-size:18px;margin:0}.tools{display:flex;gap:7px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.person{padding:13px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}.name{font-size:17px;font-weight:900}.fine{font-size:11px;color:var(--muted);margin-top:3px}.counter{display:flex;align-items:center;gap:6px}.count{font-size:24px;font-weight:950;min-width:54px;text-align:center}.sq{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#242a31;color:white;font-weight:950;cursor:pointer}.plus{background:var(--accent);color:#001b11;border:0}.plus5{background:#19382f;color:#8cffcf}.empty{grid-column:1/-1;padding:28px;text-align:center;color:var(--muted)}.tts{margin-top:13px;padding:17px}.ttsHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.ttsHead h2{margin:0;font-size:18px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{padding:6px 8px;border-radius:999px;background:#101318;border:1px solid var(--line);font-size:11px;color:var(--muted)}.chip.ok{color:#76f6c4;border-color:#235b47}.chip.bad{color:#ff9cab;border-color:#65303a}.testRow{display:flex;gap:7px;margin-top:12px}.testRow input{flex:1;background:#0e1115;border:1px solid var(--line);border-radius:9px;color:#fff;padding:10px 11px;outline:none}.last{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.6}.error{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#39171e;color:#ffb5bf;border:1px solid #65303a;border-radius:10px;padding:10px 14px;display:none;z-index:20}@media(max-width:760px){.hero,.grid{grid-template-columns:1fr}.top{flex-direction:column}.big{font-size:38px}.testRow{flex-direction:column}}
  </style>
</head>
<body><div class="wrap">
  <div class="top"><div><h1>노잡 무공 벌금 · 컨트롤</h1><div class="sub">PIN 없음 · Google Sheets가 데이터 백엔드 · 모든 스트리머는 같은 /overlay 주소 사용</div></div><div class="status" id="statusText">서버 연결 중...</div></div>

  <div class="hero">
    <div class="card total"><div class="eyebrow">TOTAL FINE</div><div class="big" id="totalAmount">-</div><div class="meta"><span id="totalCount">총 -회</span><span id="perInfo">1회당 -</span><span id="lastSync">-</span></div></div>
    <div class="card config"><h3>시트 설정</h3><div class="fields"><div class="field"><label>1회당 금액 · D2</label><input id="perCountInput" type="number" min="0"></div><div class="field"><label>단위 · E2</label><input id="unitInput" maxlength="20"></div></div><button class="btn primary save" onclick="saveConfig()">D2 / E2 저장</button></div>
  </div>

  <div class="card tts"><div class="ttsHead"><h2>파티 후원 TTS</h2><button class="btn yellow" onclick="copyOverlayUrl()">공용 OBS 링크 복사</button></div><div class="chips" id="chips"></div><div class="testRow"><input id="ttsTest" value="제발 다 사다리 좀 차주세요 제발"><button class="btn primary" onclick="testTts()">TTS 테스트</button></div><div class="last" id="lastParty">최근 파티 후원: -</div><div class="last" id="diag"></div></div>

  <div class="toolbar"><h2>참가자</h2><div class="tools"><button class="btn" onclick="openOverlay()">오버레이 열기</button><button class="btn danger" onclick="resetAllCounts()">전체 0회</button></div></div>
  <div class="grid" id="playerGrid"><div class="card empty">시트 불러오는 중...</div></div>
</div><div class="error" id="errorBox"></div>
<script>
  const $=s=>document.querySelector(s);let currentData=null,busy=false,statusData=null;
  function showError(msg){const e=$('#errorBox');e.textContent=msg;e.style.display='block';clearTimeout(showError.t);showError.t=setTimeout(()=>e.style.display='none',3800)}
  function formatAmount(n,unit=''){n=Number(n)||0;let t;if(n>=100000000&&n%100000000===0)t=(n/100000000).toLocaleString('ko-KR')+'억';else if(n>=10000&&n%10000===0)t=(n/10000).toLocaleString('ko-KR')+'만';else t=n.toLocaleString('ko-KR');return unit?`${t} ${unit}`:t}
  function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function renderFine(d,keepInputs=false){currentData=d;$('#totalAmount').textContent=formatAmount(d.totalAmount,d.unit);$('#totalCount').textContent=`총 ${d.totalCount.toLocaleString('ko-KR')}회`;$('#perInfo').textContent=`1회당 ${formatAmount(d.perCount,d.unit)}`;$('#lastSync').textContent='동기화 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});if(!keepInputs){$('#perCountInput').value=d.perCount;$('#unitInput').value=d.unit}const root=$('#playerGrid');if(!d.players.length){root.innerHTML='<div class="card empty">A2부터 닉네임을 입력해 주세요.</div>';return}root.innerHTML=d.players.map(p=>`<div class="card person"><div><div class="name">${escapeHtml(p.name)}</div><div class="fine">${formatAmount(p.amount,d.unit)}</div></div><div class="counter"><button class="sq" onclick="changeCount(${p.row},-1)">−1</button><div class="count">${p.count}</div><button class="sq plus" onclick="changeCount(${p.row},1)">+1</button><button class="sq plus5" onclick="changeCount(${p.row},5)">+5</button></div></div>`).join('')}
  async function jsonFetch(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const j=await r.json().catch(()=>({ok:false,error:`HTTP ${r.status}`}));if(!r.ok||j.ok===false)throw new Error(j.error||`HTTP ${r.status}`);return j}
  async function loadFine(keep=false){if(busy)return;try{const j=await jsonFetch('/api/fine');renderFine(j.data,keep)}catch(e){showError(e.message)}}
  async function changeCount(row,delta){if(busy)return;busy=true;try{const j=await jsonFetch('/api/fine/adjust',{method:'POST',body:JSON.stringify({row,delta})});renderFine(j.data,true)}catch(e){showError(e.message)}finally{busy=false}}
  async function saveConfig(){try{const j=await jsonFetch('/api/fine/config',{method:'POST',body:JSON.stringify({perCount:Number($('#perCountInput').value||0),unit:$('#unitInput').value.trim()})});renderFine(j.data,false)}catch(e){showError(e.message)}}
  async function resetAllCounts(){if(!confirm('모든 참가자의 횟수를 0으로 초기화할까요?'))return;try{const j=await jsonFetch('/api/fine/reset',{method:'POST',body:'{}'});renderFine(j.data,true)}catch(e){showError(e.message)}}
  async function testTts(){try{$('#statusText').textContent='TTS 생성 중...';await jsonFetch('/api/tts/test',{method:'POST',body:JSON.stringify({text:$('#ttsTest').value})});$('#statusText').textContent='TTS 생성 성공 · 오버레이 재생 요청됨';setTimeout(loadStatus,1400)}catch(e){showError('TTS 오류: '+e.message);$('#statusText').textContent='TTS 테스트 실패'}}
  async function loadStatus(){try{const j=await jsonFetch('/api/status');statusData=j;const connected=j.channels.filter(c=>c.status==='connected'||c.status==='reconnected').length;$('#statusText').textContent=`채널 ${connected}/${j.configuredChannels} · OBS ${j.overlayClients}`;const chips=[];chips.push(`<span class="chip ${j.typecast.configured?'ok':'bad'}">Typecast ${j.typecast.configured?'설정됨':'설정 필요'}</span>`);chips.push(`<span class="chip ${connected>0?'ok':'bad'}">CHZZK ${connected}/${j.configuredChannels}</span>`);chips.push(`<span class="chip ${j.sheet.configured&&!j.sheet.error?'ok':'bad'}">Sheets ${j.sheet.error?'오류':'연결'}</span>`);chips.push(`<span class="chip">voice ${escapeHtml(j.typecast.voiceId||'-')}</span>`);$('#chips').innerHTML=chips.join('');if(j.lastParty){const p=j.lastParty;$('#lastParty').textContent=`최근 파티 후원: ${p.nickname||'-'} · ${p.amount?Number(p.amount).toLocaleString('ko-KR')+'원 · ':''}${p.message||''}`}else $('#lastParty').textContent='최근 파티 후원: -';const notes=[];if(j.sheet?.error)notes.push('Sheets: '+j.sheet.error);if(j.lastTtsError)notes.push('TTS: '+j.lastTtsError);if(location.hostname==='localhost'||location.hostname==='127.0.0.1')notes.push('현재 localhost입니다. 스트리머에게 공유하려면 공개 HTTPS 주소가 필요합니다.');$('#diag').textContent=notes.join('\n');}catch(e){$('#statusText').textContent='서버 오류'}}
  function overlayUrl(){return `${location.origin}/overlay`}
  function copyOverlayUrl(){const u=overlayUrl();navigator.clipboard.writeText(u).then(()=>{$('#statusText').textContent='공용 OBS 링크 복사됨';setTimeout(loadStatus,1200)}).catch(()=>prompt('OBS 브라우저 소스 주소',u))}
  function openOverlay(){window.open(overlayUrl()+'?debug=1','_blank')}
  loadFine();loadStatus();setInterval(()=>loadFine(true),2500);setInterval(loadStatus,3000);
</script></body></html>
