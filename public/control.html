<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>노잡 무공 벌금 · 컨트롤</title>

  <style>
    :root {
      --bg: #0b0d10;
      --panel: #16191e;
      --line: #2a3038;
      --text: #f5f7fa;
      --muted: #929aa5;
      --accent: #00ffa3;
      --danger: #ff6176;
      --yellow: #ffd84a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 20% 0%,
          #14221d 0,
          #0b0d10 38%
        );

      color: var(--text);

      font-family:
        Pretendard,
        "Noto Sans KR",
        system-ui,
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 18px 60px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 16px;
    }

    .top h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -1px;
    }

    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      padding: 9px 12px;

      border: 1px solid var(--line);
      border-radius: 999px;

      background: #14171b;

      color: var(--muted);
      font-size: 12px;

      white-space: nowrap;
    }

    .card {
      background:
        linear-gradient(
          180deg,
          #191d22,
          #121519
        );

      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 12px;
    }

    .total {
      padding: 20px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
    }

    .big {
      margin: 5px 0;

      font-size: 44px;
      font-weight: 950;
      letter-spacing: -2px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;

      color: var(--muted);
      font-size: 12px;
    }

    .config {
      padding: 17px;
    }

    .config h3 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field label {
      display: block;

      margin: 0 0 5px;

      color: var(--muted);
      font-size: 10px;
    }

    .field input {
      width: 100%;

      padding: 9px 10px;

      border: 1px solid var(--line);
      border-radius: 9px;

      outline: none;

      background: #0e1115;
      color: #fff;
    }

    .btn {
      padding: 9px 12px;

      border: 0;
      border-radius: 9px;

      background: #242a31;
      color: #e7ebef;

      font-weight: 900;

      cursor: pointer;
    }

    .primary {
      background: var(--accent);
      color: #001b11;
    }

    .danger {
      background: #34171d;
      color: #ff9cab;
    }

    .yellow {
      background: #3b3213;
      color: #ffe676;
    }

    .save {
      width: 100%;
      margin-top: 9px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 10px;

      margin: 17px 0 9px;
    }

    .toolbar h2 {
      margin: 0;
      font-size: 18px;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 9px;
    }

    .person {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;

      gap: 10px;

      padding: 13px;
    }

    .name {
      font-size: 17px;
      font-weight: 900;
    }

    .fine {
      margin-top: 3px;

      color: var(--muted);
      font-size: 11px;
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .count {
      min-width: 54px;

      font-size: 24px;
      font-weight: 950;

      text-align: center;
    }

    .sq {
      min-width: 38px;
      height: 38px;

      padding: 0 9px;

      border: 1px solid var(--line);
      border-radius: 9px;

      background: #242a31;
      color: #fff;

      font-weight: 950;

      cursor: pointer;
    }

    .minus {
      background: #242a31;
    }

    .plus1 {
      border: 0;

      background: var(--accent);
      color: #001b11;
    }

    .plus3 {
      border-color: #546534;

      background: #2b351c;
      color: #dfff86;
    }

    .plus5 {
      border-color: #235b47;

      background: #19382f;
      color: #8cffcf;
    }

    .empty {
      grid-column: 1 / -1;

      padding: 28px;

      color: var(--muted);

      text-align: center;
    }

    .tts {
      margin-top: 13px;
      padding: 17px;
    }

    .ttsHead {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 10px;
    }

    .ttsHead h2 {
      margin: 0;
      font-size: 18px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;

      margin-top: 10px;
    }

    .chip {
      padding: 6px 8px;

      border: 1px solid var(--line);
      border-radius: 999px;

      background: #101318;

      color: var(--muted);
      font-size: 11px;
    }

    .chip.ok {
      border-color: #235b47;
      color: #76f6c4;
    }

    .chip.bad {
      border-color: #65303a;
      color: #ff9cab;
    }

    .testRow {
      display: flex;
      gap: 7px;

      margin-top: 12px;
    }

    .testRow input {
      flex: 1;

      padding: 10px 11px;

      border: 1px solid var(--line);
      border-radius: 9px;

      outline: none;

      background: #0e1115;
      color: #fff;
    }

    .last {
      margin-top: 10px;

      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;

      white-space: pre-wrap;
    }

    .error {
      display: none;

      position: fixed;

      left: 50%;
      bottom: 24px;

      z-index: 20;

      padding: 10px 14px;

      border: 1px solid #65303a;
      border-radius: 10px;

      background: #39171e;
      color: #ffb5bf;

      transform: translateX(-50%);
    }

    @media (max-width: 760px) {
      .hero,
      .grid {
        grid-template-columns: 1fr;
      }

      .top {
        flex-direction: column;
      }

      .big {
        font-size: 38px;
      }

      .testRow {
        flex-direction: column;
      }

      .counter {
        flex-wrap: wrap;
        justify-content: flex-end;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div class="top">

      <div>
        <h1>노잡 무공 벌금 · 컨트롤</h1>

        <div class="sub">
          PIN 없음 · Google Sheets가 데이터 백엔드 · 모든 스트리머는 같은 /overlay 주소 사용
        </div>
      </div>

      <div
        class="status"
        id="statusText"
      >
        서버 연결 중...
      </div>

    </div>


    <!-- =====================================================
         총 벌금 / 설정
    ====================================================== -->

    <div class="hero">

      <div class="card total">

        <div class="eyebrow">
          TOTAL FINE
        </div>

        <div
          class="big"
          id="totalAmount"
        >
          -
        </div>

        <div class="meta">
          <span id="totalCount">
            총 -회
          </span>

          <span id="perInfo">
            1회당 -
          </span>

          <span id="lastSync">
            -
          </span>
        </div>

      </div>


      <div class="card config">

        <h3>
          시트 설정
        </h3>

        <div class="fields">

          <div class="field">
            <label>
              1회당 금액 · D2
            </label>

            <input
              id="perCountInput"
              type="number"
              min="0"
            >
          </div>

          <div class="field">
            <label>
              단위 · E2
            </label>

            <input
              id="unitInput"
              maxlength="20"
            >
          </div>

        </div>

        <button
          class="btn primary save"
          onclick="saveConfig()"
        >
          D2 / E2 저장
        </button>

      </div>

    </div>


    <!-- =====================================================
         TTS
    ====================================================== -->

    <div class="card tts">

      <div class="ttsHead">

        <h2>
          파티 후원 TTS
        </h2>

        <button
          class="btn yellow"
          onclick="copyOverlayUrl()"
        >
          공용 OBS 링크 복사
        </button>

      </div>


      <div
        class="chips"
        id="chips"
      ></div>


      <div class="testRow">

        <input
          id="ttsTest"
          value="제발 다 사다리 좀 차주세요 제발"
        >

        <button
          class="btn primary"
          onclick="testTts()"
        >
          TTS 테스트
        </button>

      </div>


      <div
        class="last"
        id="lastParty"
      >
        최근 파티 후원: -
      </div>

      <div
        class="last"
        id="diag"
      ></div>

    </div>


    <!-- =====================================================
         참가자
    ====================================================== -->

    <div class="toolbar">

      <h2>
        참가자
      </h2>

      <div class="tools">

        <button
          class="btn"
          onclick="openOverlay()"
        >
          오버레이 열기
        </button>

        <button
          class="btn danger"
          onclick="resetAllCounts()"
        >
          전체 0회
        </button>

      </div>

    </div>


    <div
      class="grid"
      id="playerGrid"
    >
      <div class="card empty">
        시트 불러오는 중...
      </div>
    </div>

  </div>


  <div
    class="error"
    id="errorBox"
  ></div>


  <script>
    // =========================================================
    // 기본 상태
    // =========================================================

    const $ = (selector) =>
      document.querySelector(selector);

    let currentData = null;
    let busy = false;


    // =========================================================
    // 오류 표시
    // =========================================================

    function showError(message) {
      const box =
        $("#errorBox");

      box.textContent =
        message;

      box.style.display =
        "block";

      clearTimeout(
        showError.timer
      );

      showError.timer =
        setTimeout(
          () => {
            box.style.display =
              "none";
          },
          3800
        );
    }


    // =========================================================
    // 금액 표시
    // =========================================================

    function formatAmount(
      number,
      unit = ""
    ) {
      number =
        Number(number) || 0;

      let text;

      if (
        number >= 100000000 &&
        number % 100000000 === 0
      ) {
        text =
          (
            number /
            100000000
          ).toLocaleString(
            "ko-KR"
          ) +
          "억";
      }
      else if (
        number >= 10000 &&
        number % 10000 === 0
      ) {
        text =
          (
            number /
            10000
          ).toLocaleString(
            "ko-KR"
          ) +
          "만";
      }
      else {
        text =
          number.toLocaleString(
            "ko-KR"
          );
      }

      return unit
        ? `${text} ${unit}`
        : text;
    }


    // =========================================================
    // HTML 보안 처리
    // =========================================================

    function escapeHtml(value) {
      return String(value)
        .replace(
          /[&<>'"]/g,
          character => {

            const map = {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;"
            };

            return map[
              character
            ];
          }
        );
    }


    // =========================================================
    // 벌금표 렌더링
    // =========================================================

    function renderFine(
      data,
      keepInputs = false
    ) {
      currentData =
        data;


      $("#totalAmount")
        .textContent =
        formatAmount(
          data.totalAmount,
          data.unit
        );


      $("#totalCount")
        .textContent =
        `총 ${Number(
          data.totalCount || 0
        ).toLocaleString(
          "ko-KR"
        )}회`;


      $("#perInfo")
        .textContent =
        `1회당 ${formatAmount(
          data.perCount,
          data.unit
        )}`;


      $("#lastSync")
        .textContent =
        "동기화 " +
        new Date()
          .toLocaleTimeString(
            "ko-KR",
            {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit"
            }
          );


      if (!keepInputs) {
        $("#perCountInput")
          .value =
          data.perCount;

        $("#unitInput")
          .value =
          data.unit;
      }


      const root =
        $("#playerGrid");


      if (
        !data.players ||
        data.players.length === 0
      ) {
        root.innerHTML =
          `
            <div class="card empty">
              A2부터 닉네임을 입력해 주세요.
            </div>
          `;

        return;
      }


      root.innerHTML =
        data.players
          .map(
            player => {

              return `
                <div class="card person">

                  <div>

                    <div class="name">
                      ${escapeHtml(
                        player.name
                      )}
                    </div>

                    <div class="fine">
                      ${formatAmount(
                        player.amount,
                        data.unit
                      )}
                    </div>

                  </div>


                  <div class="counter">

                    <button
                      class="sq minus"
                      onclick="changeCount(
                        ${player.row},
                        -1
                      )"
                    >
                      −1
                    </button>


                    <div class="count">
                      ${player.count}
                    </div>


                    <button
                      class="sq plus1"
                      onclick="changeCount(
                        ${player.row},
                        1
                      )"
                    >
                      +1
                    </button>


                    <button
                      class="sq plus3"
                      onclick="changeCount(
                        ${player.row},
                        3
                      )"
                    >
                      +3
                    </button>


                    <button
                      class="sq plus5"
                      onclick="changeCount(
                        ${player.row},
                        5
                      )"
                    >
                      +5
                    </button>

                  </div>

                </div>
              `;
            }
          )
          .join("");
    }


    // =========================================================
    // API 요청
    // =========================================================

    async function jsonFetch(
      url,
      options = {}
    ) {
      const response =
        await fetch(
          url,
          {
            headers: {
              "Content-Type":
                "application/json",

              ...(
                options.headers ||
                {}
              )
            },

            ...options
          }
        );


      const json =
        await response
          .json()
          .catch(
            () => ({
              ok: false,
              error:
                `HTTP ${response.status}`
            })
          );


      if (
        !response.ok ||
        json.ok === false
      ) {
        throw new Error(
          json.error ||
          `HTTP ${response.status}`
        );
      }


      return json;
    }


    // =========================================================
    // 벌금 데이터 불러오기
    // =========================================================

    async function loadFine(
      keepInputs = false
    ) {
      if (busy) {
        return;
      }

      try {
        const result =
          await jsonFetch(
            "/api/fine"
          );

        renderFine(
          result.data,
          keepInputs
        );
      }
      catch (error) {
        showError(
          error.message
        );
      }
    }


    // =========================================================
    // 횟수 조정
    //
    // -1 = 1스택 감소
    // +1 = 1스택 증가
    // +3 = 3스택 증가
    // +5 = 5스택 증가
    // =========================================================

    async function changeCount(
      row,
      delta
    ) {
      if (busy) {
        return;
      }

      busy = true;

      try {
        const result =
          await jsonFetch(
            "/api/fine/adjust",
            {
              method: "POST",

              body:
                JSON.stringify({
                  row,
                  delta
                })
            }
          );


        renderFine(
          result.data,
          true
        );
      }
      catch (error) {
        showError(
          error.message
        );
      }
      finally {
        busy = false;
      }
    }


    // =========================================================
    // 금액 / 단위 저장
    // =========================================================

    async function saveConfig() {
      try {
        const result =
          await jsonFetch(
            "/api/fine/config",
            {
              method: "POST",

              body:
                JSON.stringify({
                  perCount:
                    Number(
                      $("#perCountInput")
                        .value ||
                      0
                    ),

                  unit:
                    $("#unitInput")
                      .value
                      .trim()
                })
            }
          );


        renderFine(
          result.data,
          false
        );
      }
      catch (error) {
        showError(
          error.message
        );
      }
    }


    // =========================================================
    // 전체 초기화
    // =========================================================

    async function resetAllCounts() {
      const confirmed =
        confirm(
          "모든 참가자의 횟수를 0으로 초기화할까요?"
        );

      if (!confirmed) {
        return;
      }


      try {
        const result =
          await jsonFetch(
            "/api/fine/reset",
            {
              method: "POST",
              body: "{}"
            }
          );


        renderFine(
          result.data,
          true
        );
      }
      catch (error) {
        showError(
          error.message
        );
      }
    }


    // =========================================================
    // TTS 테스트
    // =========================================================

    async function testTts() {
      try {
        $("#statusText")
          .textContent =
          "TTS 생성 중...";


        await jsonFetch(
          "/api/tts/test",
          {
            method: "POST",

            body:
              JSON.stringify({
                text:
                  $("#ttsTest")
                    .value
              })
          }
        );


        $("#statusText")
          .textContent =
          "TTS 생성 성공 · 오버레이 재생 요청됨";


        setTimeout(
          loadStatus,
          1400
        );
      }
      catch (error) {
        showError(
          "TTS 오류: " +
          error.message
        );

        $("#statusText")
          .textContent =
          "TTS 테스트 실패";
      }
    }


    // =========================================================
    // 서버 상태
    // =========================================================

    async function loadStatus() {
      try {
        const status =
          await jsonFetch(
            "/api/status"
          );


        const channels =
          status.channels || [];


        const connected =
          channels.filter(
            channel =>
              channel.status ===
                "connected" ||
              channel.status ===
                "reconnected"
          ).length;


        $("#statusText")
          .textContent =
          `채널 ${connected}/${status.configuredChannels || 0} · OBS ${status.overlayClients || 0}`;


        const chips = [];


        const typecastOk =
          Boolean(
            status.typecast
              ?.configured
          );


        chips.push(
          `
            <span class="chip ${
              typecastOk
                ? "ok"
                : "bad"
            }">
              Typecast ${
                typecastOk
                  ? "설정됨"
                  : "설정 필요"
              }
            </span>
          `
        );


        chips.push(
          `
            <span class="chip ${
              connected > 0
                ? "ok"
                : "bad"
            }">
              CHZZK
              ${connected}/${
                status.configuredChannels ||
                0
              }
            </span>
          `
        );


        const sheetOk =
          Boolean(
            status.sheet
              ?.configured
          ) &&
          !status.sheet
            ?.error;


        chips.push(
          `
            <span class="chip ${
              sheetOk
                ? "ok"
                : "bad"
            }">
              Sheets ${
                status.sheet
                  ?.error
                  ? "오류"
                  : "연결"
              }
            </span>
          `
        );


        chips.push(
          `
            <span class="chip">
              voice ${
                escapeHtml(
                  status.typecast
                    ?.voiceId ||
                  "-"
                )
              }
            </span>
          `
        );


        $("#chips")
          .innerHTML =
          chips.join("");


        if (
          status.lastParty
        ) {
          const party =
            status.lastParty;

          const amount =
            party.amount
              ? Number(
                  party.amount
                ).toLocaleString(
                  "ko-KR"
                ) +
                "원 · "
              : "";


          $("#lastParty")
            .textContent =
            `최근 파티 후원: ${
              party.nickname ||
              "-"
            } · ${amount}${
              party.message ||
              ""
            }`;
        }
        else {
          $("#lastParty")
            .textContent =
            "최근 파티 후원: -";
        }


        const notes = [];


        if (
          status.sheet
            ?.error
        ) {
          notes.push(
            "Sheets: " +
            status.sheet.error
          );
        }


        if (
          status.lastTtsError
        ) {
          notes.push(
            "TTS: " +
            status.lastTtsError
          );
        }


        if (
          location.hostname ===
            "localhost" ||
          location.hostname ===
            "127.0.0.1"
        ) {
          notes.push(
            "현재 localhost입니다.\n스트리머에게 공유하려면 공개 HTTPS 주소가 필요합니다."
          );
        }


        $("#diag")
          .textContent =
          notes.join("\n");
      }
      catch (error) {
        $("#statusText")
          .textContent =
          "서버 오류";
      }
    }


    // =========================================================
    // 오버레이 URL
    // =========================================================

    function overlayUrl() {
      return (
        location.origin +
        "/overlay"
      );
    }


    function copyOverlayUrl() {
      const url =
        overlayUrl();


      navigator.clipboard
        .writeText(url)
        .then(
          () => {
            $("#statusText")
              .textContent =
              "공용 OBS 링크 복사됨";

            setTimeout(
              loadStatus,
              1200
            );
          }
        )
        .catch(
          () => {
            prompt(
              "OBS 브라우저 소스 주소",
              url
            );
          }
        );
    }


    function openOverlay() {
      window.open(
        overlayUrl() +
        "?debug=1",
        "_blank"
      );
    }


    // =========================================================
    // 시작
    // =========================================================

    loadFine();
    loadStatus();


    setInterval(
      () => {
        loadFine(true);
      },
      2500
    );


    setInterval(
      loadStatus,
      3000
    );
  </script>

</body>
</html>
